<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f3d2b" />
    <title>Offline · Kainan sa Kubo</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #fdf6e9; color: #3e2614; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 360px; }
      img { width: 160px; height: 160px; object-fit: contain; }
      h1 { margin: 16px 0 8px; font-size: 1.6rem; color: #1f3d2b; }
      p { margin: 0 0 20px; line-height: 1.5; color: #6b5a48; }
      button {
        border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 700;
        background: #1f3d2b; color: #fdf6e9; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/kubo-emblem.png" alt="Kainan sa Kubo" />
      <h1>Walang internet</h1>
      <p>You're offline. Check your Wi-Fi or mobile data, then try again. Orders and the POS need a connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
